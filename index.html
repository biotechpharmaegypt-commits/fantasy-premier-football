<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy EPL</title>
<meta name="theme-color" content="#14123a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecf8;--ink:#171540;--mute:#6b6a8f;--card:#ffffff;--line:rgba(23,21,64,.1);
  --hot:#ff3d7f;--sun:#ffc933;--grass1:#0f6b4f;--grass2:#0c5c44;--shell:#14123a;--shellText:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07061c;--ink:#f1f0ff;--mute:#9b9ac4;--card:#16143f;--line:rgba(255,255,255,.1);--shell:#0b0a2b;}}
:root[data-theme="dark"]{--bg:#07061c;--ink:#f1f0ff;--mute:#9b9ac4;--card:#16143f;--line:rgba(255,255,255,.1);--shell:#0b0a2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",Cairo,system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
[dir=rtl] body,[dir=rtl] button{font-family:Cairo,"Bricolage Grotesque",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{width:100%;max-width:420px;height:100%;max-height:880px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:520px){.app{height:min(880px,calc(100% - 32px));border-radius:38px;box-shadow:0 30px 80px rgba(20,18,58,.35),0 0 0 10px var(--shell)}}

/* header */
.top{background:var(--shell);color:var(--shellText);padding:18px 18px 54px;position:relative}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo i{font-style:normal;color:var(--sun)}
.lang{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.12);font-weight:700;font-size:13px}
.gw{margin-top:16px;display:flex;align-items:flex-end;justify-content:space-between}
.gw b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-1px}
.gw small{display:block;color:#b9b8e6;font-size:12px;margin-bottom:6px}
.count{display:flex;gap:6px;direction:ltr}
.count div{background:rgba(255,255,255,.1);border-radius:10px;padding:6px 8px;min-width:44px;text-align:center;font-weight:800;font-size:18px;line-height:1.1}
.count span{display:block;font-size:10px;font-weight:500;color:#b9b8e6}
.stats{color:var(--ink);position:absolute;inset-inline:16px;bottom:-34px;background:var(--card);border-radius:20px;display:flex;box-shadow:0 12px 30px rgba(20,18,58,.25);overflow:hidden}
.stats div{flex:1;padding:12px 8px;text-align:center}
.stats div+div{border-inline-start:1px solid var(--line)}
.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.stats div:first-child b{color:var(--hot)}
.stats span{font-size:11px;color:var(--mute)}

/* views */
.view{flex:1;overflow-y:auto;padding:50px 14px 12px}
.pitch{border-radius:24px;padding:16px 4px 14px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass1) 0 46px,var(--grass2) 46px 92px)}
.pitch::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.35);border-radius:14px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border:2px solid rgba(255,255,255,.3);border-radius:50%;pointer-events:none}
.line{display:flex;justify-content:space-evenly;position:relative;z-index:1;direction:ltr}
.pl{width:74px;text-align:center;color:#fff;transition:transform .15s}
.pl svg{width:50px;height:50px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.pl.sel{transform:translateY(-6px) scale(1.1)}
.pl.sel svg{filter:drop-shadow(0 0 10px var(--sun))}
.nm{display:block;background:#fff;color:#171540;font-size:11px;font-weight:800;border-radius:6px 6px 0 0;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{display:block;background:var(--shell);color:#fff;font-size:11px;font-weight:700;border-radius:0 0 6px 6px;padding:1px 0}
.badge{position:absolute;margin-top:-4px;margin-inline-start:-2px;width:20px;height:20px;border-radius:50%;background:var(--sun);color:#171540;font-size:11px;font-weight:800;line-height:20px;transform:translateX(18px)}
.badge.v{background:#fff}
.benchbox{margin-top:12px;background:var(--card);border-radius:20px;padding:10px 4px 12px}
.benchbox h4,.sec{margin:0 8px 8px;font-size:14px;font-weight:800}
.benchbox .line .pl{color:var(--ink)}
.hint{text-align:center;font-size:12px;color:var(--mute);margin:10px 0 4px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:12px;border-radius:14px;background:var(--card);font-weight:800;box-shadow:inset 0 0 0 2px var(--line)}
.acts button:first-child{background:var(--sun);color:#171540;box-shadow:none}

/* players */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);font-weight:700;font-size:13px;white-space:nowrap}
.chip.on{background:var(--hot);color:#fff}
.search{width:100%;padding:12px 14px;border-radius:14px;border:0;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 12px;margin-bottom:8px}
.item svg{width:38px;height:38px;flex:none}
.item div{flex:1;min-width:0}
.item b{display:block;font-size:15px}
.item small{color:var(--mute);font-size:12px}
.price{font-weight:800;color:var(--hot)}

/* league */
.me{background:linear-gradient(135deg,var(--hot),#7a3cff);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}
.me b{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.me span{display:block;opacity:.85;font-size:13px}
.lb{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.lb.you{box-shadow:0 0 0 2px var(--hot)}
.lb .r{width:28px;font-weight:800;font-size:18px;color:var(--mute)}
.lb:nth-child(2) .r{color:var(--sun)}
.lb div{flex:1;font-weight:700}
.lb em{font-style:normal;font-weight:800}
.up{color:#14b87a}.dn{color:var(--hot)}

/* tabs */
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;padding:8px 4px;border-radius:14px;font-weight:700;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--hot);background:rgba(255,61,127,.1)}
.toast{z-index:30;position:absolute;left:16px;right:16px;bottom:84px;background:var(--hot);color:#fff;padding:12px 14px;border-radius:14px;font-weight:700;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{position:absolute;inset:0;z-index:20;background:var(--bg);padding:28px;display:none;flex-direction:column;justify-content:center;gap:12px}
.auth.on{display:flex}
.auth h1{margin:0 0 8px;font-size:30px;letter-spacing:-1px}.auth h1 i{font-style:normal;color:var(--hot)}
.btn{padding:14px;border-radius:14px;background:var(--hot);color:#fff;font-weight:800;font-size:16px;width:100%}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.cr{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#fff;color:#171540;font-size:11px;font-weight:800;border:2px solid var(--shell);box-shadow:0 4px 6px rgba(0,0,0,.3);overflow:hidden}
.cr img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;background:#fff;border-radius:50%}
.cr.s{width:38px;height:38px;box-shadow:none;border:1px solid var(--line);flex:none}
.pl.sel .cr{box-shadow:0 0 0 3px var(--sun),0 0 14px var(--sun)}
.pl{position:relative}.badge{position:absolute;top:-4px;inset-inline-end:8px;margin:0;transform:none}
.item .go{padding:7px 12px;border-radius:99px;font-weight:800;font-size:13px;background:rgba(255,61,127,.14);color:var(--hot)}
.item .go.rm{background:rgba(20,184,122,.16);color:#14b87a}
.need{background:var(--card);border-radius:20px;padding:20px;text-align:center}
.need b{font-size:42px;font-weight:800;color:var(--hot)}.need .grid{display:flex;gap:8px;justify-content:center;margin:14px 0}
.need .grid span{background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}
.save{margin-top:10px}
.amsg{min-height:22px;margin:0;color:var(--hot);font-weight:700;font-size:14px;text-align:center}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#14b87a;margin-inline-start:8px;vertical-align:middle;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,184,122,.7)}70%{box-shadow:0 0 0 7px rgba(20,184,122,0)}100%{box-shadow:0 0 0 0 rgba(20,184,122,0)}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.link{color:var(--mute);font-size:13px;text-align:center;display:block;margin:12px auto 0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="row"><div class="logo" id="logo"></div><button class="lang" id="lang"></button></div>
    <div class="gw"><div><small id="gwl"></small><b id="gwn"></b></div><div class="count" id="count"></div></div>
    <div class="stats" id="stats"></div>
  </header>
  <main class="view" id="view"></main>
  <nav class="tabs" id="tabs"></nav>
  <div class="toast" id="toast"></div>
  <section class="auth" id="auth"></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://lpexvjgdhkfnlzyldcrd.supabase.co";
// anon key is public by design; data is protected by Row Level Security. NEVER put the service_role key here.
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwZXh2amdkaGtmbmx6eWxkY3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NzA0NTAsImV4cCI6MjEwODQ0NjQ1MH0.vls-iByfDkuFeQYoSGai7_IzT7_qxUQq55bqLKgdZWc";

const crestUrl=c=>`https://resources.premierleague.com/premierleague/badges/70/t${c}.png`;

const TXT={
 en:{logo:"Fantasy <i>EPL</i>",gw:"Next deadline",pts:"Points",cnt:"Players",bank:"Bank",squad:"Squad",players:"Players",league:"League",bench:"Bench",
  hint:"Tap a player, then another to swap",cap:"Make captain",vice:"Make vice",search:"Search players",all:"All",GK:"GK",DEF:"DEF",MID:"MID",FWD:"FWD",
  d:"days",h:"hrs",m:"min",s:"sec",bad:"Invalid formation: 1 GK, 3-5 DEF, 2-5 MID, 1-3 FWD",save:"Save squad",saved:"Squad saved",need15:"Pick 15 players first",

  noBoard:"No saved squads yet",cset:"Captain set",vset:"Vice set",goPlayers:"Pick players",you:"You"},
 ar:{logo:"فانتازي <i>EPL</i>",gw:"الموعد النهائي القادم",pts:"النقاط",cnt:"اللاعبون",bank:"الرصيد",squad:"التشكيلة",players:"اللاعبون",league:"الدوري",bench:"الاحتياطي",
  hint:"اضغط لاعب ثم لاعب آخر للتبديل",cap:"اجعله كابتن",vice:"اجعله نائب",search:"ابحث عن لاعب",all:"الكل",GK:"حارس",DEF:"مدافع",MID:"وسط",FWD:"مهاجم",
  d:"يوم",h:"ساعة",m:"دقيقة",s:"ثانية",bad:"تشكيل غير صالح: حارس، 3-5 مدافعين، 2-5 وسط، 1-3 مهاجمين",save:"حفظ الفريق",saved:"تم حفظ الفريق",need15:"اختر 15 لاعباً أولاً",
  needCap:"اختر كابتن ونائب كابتن",locked:"انتهى الموعد النهائي، الفريق مقفول",email:"البريد الإلكتروني",pass:"كلمة المرور",signin:"تسجيل الدخول",signup:"إنشاء حساب",
  confirm:"افتح بريدك للتأكيد ثم سجّل الدخول",logout:"تسجيل الخروج",authInput:"اكتب بريداً صحيحاً وكلمة مرور من 6 أحرف على الأقل",add:"إضافة",rm:"حذف",errPos:"لا يوجد مكان لهذا المركز",errClub:"الحد الأقصى 3 لاعبين من النادي",

  noBoard:"لا توجد فرق محفوظة بعد",cset:"تم تعيين الكابتن",vset:"تم تعيين النائب",goPlayers:"اختر اللاعبين",you:"أنت"}
};
const $=id=>document.getElementById(id);
let lang="ar",tab="squad",filt=0,q="",sel=null,all=[],list=[],user=null,gw=null,board=[],loaded=false;
let squadId=null,dirty=false,live=false,rt=null,rtSquad=null,rsT,lbT;
try{lang=localStorage.getItem("lang")||"ar"}catch(e){}
const t=k=>TXT[lang][k], PK=["","GK","DEF","MID","FWD"], LIM={1:2,2:5,3:5,4:3};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mk=r=>({id:r.id,n:r.web_name,pos:r.position,pr:+r.price,pts:r.total_points||0,tid:r.team_id,sn:r.teams?.short_name||"",code:r.teams?.code,c:0,v:0});
const sum=(l,f)=>l.reduce((a,p)=>a+f(p),0);
const locked=()=>!!gw&&new Date(gw.deadline_time)<new Date();
const ok=l=>{const c=p=>l.slice(0,11).filter(x=>x.pos===p).length;return c(1)===1&&c(2)>=3&&c(2)<=5&&c(3)>=2&&c(3)<=5&&c(4)>=1&&c(4)<=3};
const auto=l=>{const n={1:1,2:4,3:4,4:2},st=[],bn=[];for(const p of[1,2,3,4])l.filter(x=>x.pos===p).forEach((x,i)=>(i<n[p]?st:bn).push(x));return[...st,...bn].map((p,i)=>i>=11?{...p,c:0,v:0}:p)};
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
const crest=(p,s)=>`<span class="cr ${s||""}">${esc(p.sn)}${p.code?`<img src="${crestUrl(p.code)}" alt="" onerror="this.remove()">`:""}</span>`;

function chrome(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("logo").innerHTML=t("logo")+(live?'<span class="live"></span>':"");$("lang").textContent=lang==="ar"?"English":"العربية";$("gwl").textContent=t("gw");$("gwn").textContent=gw?gw.name:"—";
 const pts=list.length===15?sum(list.slice(0,11),p=>p.pts*(p.c?2:1)):sum(list,p=>p.pts);
 $("stats").innerHTML=`<div><b>${pts}</b><span>${t("pts")}</span></div><div><b>${list.length}/15</b><span>${t("cnt")}</span></div><div><b>£${(100-sum(list,p=>p.pr)).toFixed(1)}m</b><span>${t("bank")}</span></div>`;
 const ic={squad:'<path d="M3 5h18v14H3zM12 5v14M3 12h18"/>',players:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',league:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM5 5H3v2a3 3 0 0 0 3 3M19 5h2v2a3 3 0 0 1-3 3M12 14v4M8 21h8"/>'};
 $("tabs").innerHTML=["squad","players","league"].map(k=>`<button data-tab="${k}" class="${tab===k?"on":""}"><svg viewBox="0 0 24 24">${ic[k]}</svg>${t(k)}</button>`).join("");
 $("auth").innerHTML=`<h1>${t("logo")}</h1><input class="search" id="em" type="email" autocomplete="email" placeholder="${t("email")}"><input class="search" id="pw" type="password" autocomplete="current-password" placeholder="${t("pass")}"><button class="btn" data-auth="in">${t("signin")}</button><button class="btn alt" data-auth="up">${t("signup")}</button><p class="amsg" id="amsg"></p><button class="link" id="lang2">${lang==="ar"?"English":"العربية"}</button>`;
}
const chipEl=i=>{const p=list[i];return `<button class="pl ${sel===i?"sel":""}" data-i="${i}">${p.c?'<span class="badge">C</span>':p.v?'<span class="badge v">V</span>':""}${crest(p)}<span class="nm">${esc(p.n)}</span><span class="pt">${p.pts}</span></button>`};

function render(){
 $("auth").classList.toggle("on",!user);
 const keep=$("em")?.value,keepP=$("pw")?.value;chrome();if(keep!==undefined){$("em").value=keep;$("pw").value=keepP}
 const v=$("view");
 if(!user){v.innerHTML="";return}
 if(!loaded){v.innerHTML=`<p class="hint">${t("load")}</p>`;return}
 if(tab==="squad"){
  if(list.length<15){
   v.innerHTML=`<div class="need"><b>${list.length}/15</b><p>${t("build")}</p><div class="grid">${[1,2,3,4].map(k=>`<span>${t(PK[k])} ${list.filter(p=>p.pos===k).length}/${LIM[k]}</span>`).join("")}</div><button class="btn" data-tab="players">${t("goPlayers")}</button></div>`;return}
  const rows=[1,2,3,4].map(pos=>`<div class="line">${list.map((p,i)=>i<11&&p.pos===pos?chipEl(i):"").join("")}</div>`).join("");
  v.innerHTML=`<div class="pitch">${rows}</div><div class="benchbox"><h4>${t("bench")}</h4><div class="line">${[11,12,13,14].map(chipEl).join("")}</div></div>
   ${sel!==null&&sel<11?`<div class="acts"><button data-a="cap">★ ${t("cap")}</button><button data-a="vice">${t("vice")}</button></div>`:`<p class="hint">${t("hint")}</p>`}
   <button class="btn save" data-save="1">${t("save")}</button>`;
 }else if(tab==="players"){
  const shown=all.filter(p=>(!filt||p.pos===filt)&&p.n.toLowerCase().includes(q.toLowerCase())).slice(0,80);
  v.innerHTML=`<input class="search" id="q" placeholder="${t("search")}" value="${esc(q)}"><div class="chips">${[0,1,2,3,4].map(k=>`<button class="chip ${filt===k?"on":""}" data-f="${k}">${k?t(PK[k]):t("all")}</button>`).join("")}</div>

function togglePlayer(id){
 const i=list.findIndex(x=>x.id===id);
 if(i>=0){list.splice(i,1);return}
 const p=all.find(x=>x.id===id);
 if(list.length>=15)return toast(t("full"));
 if(list.filter(x=>x.pos===p.pos).length>=LIM[p.pos])return toast(t("errPos"));
 if(list.filter(x=>x.tid===p.tid).length>=3)return toast(t("errClub"));
 if(sum(list,x=>x.pr)+p.pr>100.0001)return toast(t("errBudget"));
 list.push({...p});
 if(list.length===15)list=auto(list);
}
async function save(){
 if(list.length!==15)return toast(t("need15"));
 if(!list.some(p=>p.c)||!list.some(p=>p.v))return toast(t("needCap"));
 if(locked())return toast(t("locked"));
 const {data:sq,error}=await sb.from("squads").upsert({user_id:user.id,name:"My Team",budget:+(100-sum(list,p=>p.pr)).toFixed(1)},{onConflict:"user_id"}).select("id").single();
 if(error)return toast(error.message);
 squadId=sq.id;
 await sb.from("squad_players").delete().eq("squad_id",sq.id);
 const {error:e2}=await sb.from("squad_players").insert(list.map((p,i)=>({squad_id:sq.id,player_id:p.id,slot:i+1,is_captain:!!p.c,is_vice:!!p.v,purchase_price:p.pr})));
 if(!e2){dirty=false;if(rtSquad!==squadId)subscribe()}
 toast(e2?e2.message:t("saved"));
}
const PSEL="id,web_name,position,price,total_points,team_id,teams(short_name,code)";
async function loadSquad(){
 const {data:sq}=await sb.from("squads").select("id").eq("user_id",user.id).maybeSingle();
 if(!sq){squadId=null;return}
 squadId=sq.id;
 const {data}=await sb.from("squad_players").select(`slot,is_captain,is_vice,players(${PSEL})`).eq("squad_id",sq.id).order("slot");
 list=(data||[]).map(r=>({...mk(r.players),c:r.is_captain?1:0,v:r.is_vice?1:0}));
 if(list.length===15&&!ok(list))list=auto(list);
 dirty=false;
}
async function fetchBase(){
 const [pl,g]=await Promise.all([
  sb.from("players").select(PSEL).order("total_points",{ascending:false}).limit(1000),
  sb.from("gameweeks").select("name,deadline_time").eq("is_next",true).maybeSingle()]);
 return {pl:pl.data,g:g.data};
}
async function boot(){
 loaded=false;render();
 const {pl,g}=await fetchBase();
 all=(pl||[]).map(mk);gw=g;list=[];
 await loadSquad();
 loaded=true;render();tick();subscribe();
}
// refresh prices/points/deadline without touching the user's lineup edits
async function refreshData(){
 if(!user||!loaded)return;
 const {pl,g}=await fetchBase();
 if(pl){all=pl.map(mk);const m=new Map(all.map(p=>[p.id,p]));list=list.map(p=>{const n=m.get(p.id);return n?{...n,c:p.c,v:p.v}:p})}
 gw=g;
 if(document.activeElement?.id!=="q")render();
}
function reloadSquad(){clearTimeout(rsT);rsT=setTimeout(async()=>{
 if(dirty)return;
 await loadSquad();render();
 if(squadId&&rtSquad!==squadId)subscribe();
},900)}
function unsub(){if(rt){sb.removeChannel(rt);rt=null}rtSquad=null;live=false}
// Realtime: my squad changes on another device + league standings
function subscribe(){
 unsub();rtSquad=squadId;
 rt=sb.channel("fantasy-"+user.id)
  .on("postgres_changes",{event:"*",schema:"public",table:"squads"},p=>{
    const uid=(p.new&&p.new.user_id)||(p.old&&p.old.user_id);
    if(uid===user.id)reloadSquad();
    else if(tab==="league"){clearTimeout(lbT);lbT=setTimeout(loadBoard,600)}});
 if(squadId)rt.on("postgres_changes",{event:"*",schema:"public",table:"squad_players",filter:"squad_id=eq."+squadId},()=>reloadSquad());
 rt.subscribe(st=>{live=st==="SUBSCRIBED";chrome()});
}
async function loadBoard(){
 const {data}=await sb.from("squads").select("user_id,name,total_points,profiles(display_name)").order("total_points",{ascending:false}).limit(50);
 board=data||[];render();
}
document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="lang"||b.id==="lang2"){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lang",lang)}catch(_){}return render()}
 if(b.dataset.auth){const email=$("em").value.trim(),password=$("pw").value,am=$("amsg"),up=b.dataset.auth==="up";
  if(!email||password.length<6){am.textContent=t("authInput");return}
  am.textContent="...";b.disabled=true;
  try{
   const r=up?await sb.auth.signUp({email,password,options:{data:{display_name:email.split("@")[0]}}}):await sb.auth.signInWithPassword({email,password});
   if(r.error)am.textContent=r.error.message;
   else if(up&&!r.data.session)am.textContent=t("confirm");
   else am.textContent="";
  }catch(err){am.textContent=String(err&&err.message||err)}
  b.disabled=false;return}
 if(b.dataset.out){await sb.auth.signOut();return}
 if(b.dataset.save)return save();
 if(b.dataset.tab){tab=b.dataset.tab;sel=null;render();if(tab==="league")loadBoard();return}
 if(b.dataset.f){filt=+b.dataset.f;return render()}
 if(b.dataset.p){dirty=true;togglePlayer(+b.dataset.p);return render()}
 if(b.dataset.a){if(locked())return toast(t("locked"));dirty=true;const k=b.dataset.a==="cap"?"c":"v",o=k==="c"?"v":"c";list=list.map((p,i)=>i===sel?{...p,[k]:1,[o]:0}:{...p,[k]:0});toast(t(k==="c"?"cset":"vset"));sel=null;return render()}
 if(b.dataset.i!==undefined){if(locked())return toast(t("locked"));const i=+b.dataset.i;
  if(sel===null)sel=i;else if(sel===i)sel=null;else{const n=[...list];[n[sel],n[i]]=[n[i],n[sel]];
   if(!ok(n)){toast(t("bad"));sel=null;return render()}
   list=n.map((p,k)=>k>=11?{...p,c:0,v:0}:p);sel=null;dirty=true}
  render()}
});
function tick(){const el=$("count");if(!gw){el.innerHTML="";return}
 const d=Math.max(0,new Date(gw.deadline_time)-Date.now()),f=(n,l)=>`<div>${String(n).padStart(2,"0")}<span>${t(l)}</span></div>`;
 el.innerHTML=f(Math.floor(d/864e5),"d")+f(Math.floor(d/36e5)%24,"h")+f(Math.floor(d/6e4)%60,"m")+f(Math.floor(d/1e3)%60,"s")}
setInterval(tick,1000);
sb.auth.onAuthStateChange((_ev,s)=>{const u=s?.user||null;if(u?.id===user?.id){return}user=u;if(user)boot();else{list=[];loaded=false;squadId=null;unsub();render()}});
sb.auth.getSession().then(({data})=>{if(!data.session)render()});
setInterval(refreshData,300000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&user&&loaded){refreshData();reloadSquad()}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
